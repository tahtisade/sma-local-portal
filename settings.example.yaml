resol:
  url: "http://192.0.2.40/dlx/download/live?"
  header_index: 1
  field_index: 11
  poll_interval: 10

heater:
  title: "PV Surplus Load"

  # Optional display-only temperature settings.
  # These values are shown in the web interface only.
  # They do not implement temperature control or safety limits.
  # temperature_limit: <value in °C>
  # temperature_resume: <value in °C>

charge_meter:
  # Optional Modbus RTU energy meter used for measuring
  # the actual EV charging power and energy.
  enabled: false
  port: "/dev/ttyUSB0"
  device_id: 1
  baudrate: 9600
  bytesize: 8
  parity: "E"
  stopbits: 1
  timeout: 2
